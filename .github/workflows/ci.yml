name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  # Etiquetar el PR (prueba en simulador) no debe cancelar la CI normal en curso.
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'smoke' || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: GymCore tests (Linux)
    # Añadir una etiqueta no cambia el código: no repetir los jobs obligatorios.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        run: swift test --package-path Packages/GymKit

  ios:
    name: GymKit tests (macOS) + IPA
    needs: core-tests
    # En repos privados, los minutos de macOS cuentan x10 en la cuota gratuita.
    # Por eso aquí no se usa simulador: los modelos se testean en el propio Mac.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          # Xcode estable más reciente instalado en el runner (SDK actual de iOS).
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Tests de GymKit (GymCore + GymData)
        run: swift test --package-path Packages/GymKit

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Compilar IPA para Sideloadly
        run: scripts/build-ipa.sh

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-ipa-${{ github.run_number }}
          path: build/GymTracker.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Prueba en simulador (bajo demanda)
    # Cara (~10 min de macOS). Se lanza a mano o con la etiqueta "simulador" en el PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'simulador')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Abrir la app en el simulador
        run: scripts/smoke-ios.sh

      - name: Subir captura y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulador-${{ github.run_number }}
          path: build/smoke/
          if-no-files-found: ignore
          retention-days: 14
