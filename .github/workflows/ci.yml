name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: GymCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path Packages/GymCore

  ios:
    name: iOS tests + IPA
    needs: core-tests
    # En repos privados, los minutos de macOS cuentan x10 en la cuota gratuita.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Tests de la app (simulador)
        run: |
          mkdir -p build
          scripts/test-ios.sh

      - name: Compilar IPA sin firmar
        run: scripts/build-ipa.sh

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-ipa-${{ github.run_number }}
          path: build/GymTracker.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            build/*.log
            build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
