# Definición del proyecto Xcode para XcodeGen (https://github.com/yonaskolb/XcodeGen).
# El .xcodeproj no se versiona: se genera con `xcodegen generate`.
name: GymTracker

options:
  bundleIdPrefix: com.pablitodab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GymKit:
    path: Packages/GymKit

targets:
  GymTracker:
    type: application
    platform: iOS
    sources:
      - path: GymTracker
        # Info.plist y entitlements se referencian desde los build settings, no se copian.
        excludes:
          - "SupportingFiles/**"
    dependencies:
      - package: GymKit
        product: GymCore
      - package: GymKit
        product: GymData
    settings:
      base:
        PRODUCT_NAME: GymTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.pablitodab.gymtracker
        INFOPLIST_FILE: GymTracker/SupportingFiles/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: GymTracker/SupportingFiles/GymTracker.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO

schemes:
  GymTracker:
    build:
      targets:
        GymTracker: all
    run:
      config: Debug
    archive:
      config: Release
