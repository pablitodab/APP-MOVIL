# Definición del proyecto Xcode para XcodeGen (https://github.com/yonaskolb/XcodeGen).
# El .xcodeproj no se versiona: se genera con `xcodegen generate`.
name: GymTracker

options:
  bundleIdPrefix: com.pablitodab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GymCore:
    path: Packages/GymCore

targets:
  GymTracker:
    type: application
    platform: iOS
    sources:
      - path: GymTracker
        # Info.plist y entitlements se referencian desde los build settings, no se copian.
        excludes:
          - "SupportingFiles/**"
    dependencies:
      - package: GymCore
    settings:
      base:
        PRODUCT_NAME: GymTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.pablitodab.gymtracker
        INFOPLIST_FILE: GymTracker/SupportingFiles/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: GymTracker/SupportingFiles/GymTracker.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO

  GymTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GymTrackerTests
    dependencies:
      # GymCore no se enlaza aquí: ya va dentro de la app (test host). Enlazarlo dos veces
      # duplicaría sus tipos y romperían los `as?` sobre errores lanzados por la app.
      - target: GymTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablitodab.gymtracker.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GymTracker:
    build:
      targets:
        GymTracker: all
        GymTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GymTrackerTests
    archive:
      config: Release
